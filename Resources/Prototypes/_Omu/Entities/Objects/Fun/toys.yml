- type: entity
  parent: WardenRapier
  id: FoamRapier
  name: Foam Rapier
  description: En garde!
  components:
  - type: MeleeWeapon
  - type: StaminaDamageOnHit
    Damage: 8
  - type: UseDelay
    delay: 3
  - type: Reflect
    reflectProb: 0.05
    spread: 3
    soundOnReflect:
      path: /Audio/_Goobstation/Effects/Parry/parry.ogg
  - type: Contraband
    severity: Honkraband

- type: entity
  parent: BaseItem
  id: WeaponLightMachineGunL6Foam
  name: Foam L6 SAW
  description: Features a speaker for enhanced immersion... none of the parts move so you don't feel that immersed.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    layers:
    - state: base
    - state: mag-3
  - type: Item
    size: Large
    shape:
    - 0,0,3,1
  - type: Clothing
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Omu/Weapons/ToyLMG.ogg
      params:
        volume: -0.5
  - type: PacifismAllowedGun
  - type: BallisticAmmoProvider
    autoCycle: true
    capacity: 100
    proto: BulletFoam
    whitelist:
      tags:
      - BulletFoam
  - type: Wieldable
    unwieldOnUse: false

- type: entity
  parent: BaseNullrod
  id: NullRodFoam
  name: Foam Rod
  description: This is what you devoted your life to?
  components:
  - type: Sprite
    sprite: _DV/Objects/Fun/Toys/foam_sabre.rsi #placeholder
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Holy: 15
    soundHit:
      path: /Audio/_DV/CosmicCult/cosmicsword_hit.ogg #placeholder
      params:
        variation: 0.2
        volume: 1
    animationRotation: -135
    wideAnimationRotation: -135
  - type: StaminaDamageOnHit
    damage: 5
  - type: Tag
    tags:
    - Nullrod