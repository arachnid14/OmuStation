- type: entity
  parent: BulletFoam
  id: BulletFoamNail
  name: Nail Dart
  description: A dart that has been modified with a nail, ouch.
  components:
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 3 #currently the same as default nails
      armorPenetration: -1.75

- type: entity
  parent: [ BulletFoam, BaseSyndicateContraband ]
  id: BulletFoamNailArmorPiercing
  name: AP Nail Dart
  description: A dart that has been modified with an extra strong armor-piercing nail.
  components:
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 3
      armorPenetration: 0.65

- type: entity
  parent: WardenRapier
  id: FoamRapier
  name: Foam Rapier
  description: En garde!
  components:
  - type: StaminaDamageOnHit
    Damage: 8
  - type: MeleeWeapon
  - type: UseDelay
    delay: 3
  - type: Reflect
    reflectProb: 0.05
    spread: 0 
  - type: Contraband
    severity: Honkraband

- type: entity
  parent: BaseItem
  id: WeaponLightMachineGunL6Foam
  name: Foam L6 SAW
  description: Features a speaker for enhanced immersion... none of the parts move so you don't feel that immersed.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    layers:
    - state: base
    - state: mag-3
  - type: Item
    size: Large
    shape:
    - 0,0,3,1
  - type: Clothing
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Omu/Weapons/ToyLMG.ogg
  - type: BallisticAmmoProvider
    autoCycle: true
    capacity: 100
    proto: BulletFoam
    whitelist:
      tags:
      - BulletFoam
  - type: Wieldable
    unwieldOnUse: false

- type: entity
  parent: WeaponLightMachineGunL6Foam
  id: Debugl6nails
  name: Foam L6 SAW
  suffix: AP nails
  components:
  - type: BallisticAmmoProvider
    autoCycle: true
    capacity: 100
    proto: BulletFoamNailArmorPiercing
    whitelist:
      tags:
      - BulletFoam


